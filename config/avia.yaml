/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            map_frame:  "camera_init"   # world-fixed frame the odometry/path/global clouds are published in
            body_frame: "body"          # IMU body frame: child frame of /Odometry and of the published TF
            lid_frame:  "lidar"         # LiDAR frame, only used when publish.tf_lidar_en is true
            base_frame: "base_link"     # robot base, only used when publish.tf_base_en is true
            gravity_align_en: false      # true: rotate the world frame at init so its z axis is up,
                                         # using the averaged accelerometer. Leave false and the world
                                         # frame is simply the IMU frame at startup, so any mounting
                                         # tilt (or starting slope) tilts the whole map and odometry.
                                         # Only roll/pitch are observable; yaw stays as-started.
            origin_at_base_en: false     # true: place the world origin on base_frame's initial pose
                                         # instead of the IMU's. The position state is the IMU's and
                                         # starts at zero, so by default the origin sits wherever the
                                         # IMU is mounted -- leaving the ground plane at a non-zero z
                                         # and base_frame offset from the origin at startup. Needs
                                         # lid_frame -> base_frame from TF, and the node waits for it
                                         # before initialising rather than starting off-origin.
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
            scan_line: 6
            blind: 4.0

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    90.0
            det_range:     450.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ 0.04165, 0.02326, -0.0284 ]
            extrinsic_R: [ 1., 0., 0.,
                        0., 1., 0.,
                        0., 0., 1.]

        publish:
            path_en:  false
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame
            tf_en: true                  # false: do not broadcast the map_frame -> body_frame TF
                                         # (set false when another node, e.g. an EKF, already owns that edge)
            tf_lidar_en: false           # true: also broadcast a static body_frame -> lid_frame TF from the IMU-LiDAR extrinsic
            tf_base_en: false            # true: also broadcast map_frame -> base_frame, composing the
                                         # pose with lid_frame -> base_frame looked up from TF. Use this
                                         # instead of setting body_frame to the base: the estimated pose
                                         # is the IMU's, which is offset (and usually rotated) from the base
            odom_in_base_en: false       # true: /Odometry reports base_frame instead of body_frame, with the
                                         # pose composed the same way as tf_base_en. Use when another node
                                         # (e.g. an EKF) owns the map -> base TF but wants the base pose

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
            save_interval_sec: 0.0       # > 0: also save periodically, every N seconds. 0 or less leaves
                                         # saving on demand only, via the /map_save service.
            keep_history: false          # true: every save also writes a timestamped copy alongside
                                         # map_file_path. Each copy is a full snapshot of a map that
                                         # keeps growing, so disk use grows quadratically with run time
